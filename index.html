<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Five2Go</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Roboto Slab"', 'serif'],
                    },
                    colors: {
                        primary: '#264653',          
                        'ct-terracotta': '#E76F51',  
                        'ct-terracotta-light': '#FFEDE1', 
                        'ct-yellow': '#E9C46A',      
                        'ct-yellow-light': '#FFFBEB',
                        'ct-blue': '#2A9D8F',        
                        'ct-blue-light': '#E0F7FA',
                        'ct-green': '#606C38',       
                        'ct-green-light': '#ECFCCB',
                        'ct-sand': '#F4F1DE',        
                        surface: '#FFFFFF',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -5px rgba(0,0,0,0.1)', 
                        'floating': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    },
                    borderRadius: {
                        '3xl': '1.5rem', 
                        '4xl': '2.5rem',
                    }
                }
            }
        }
    </script>

    <style>
        /* FIX SAFARI: min-height 100dvh */
        html, body {
            height: 100%; 
            min-height: 100dvh;
            width: 100%; 
            overflow-x: hidden;
            overscroll-behavior-y: none; 
            -webkit-tap-highlight-color: transparent;
            background-color: #F4F1DE; 
            color: #264653;
            /* Gestione SafeArea per iPhone X e successivi */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes popIn { 
            0% { opacity: 0; transform: translateY(10px) scale(0.95); } 
            100% { opacity: 1; transform: translateY(0) scale(1); } 
        }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        .nav-center-bump {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 60;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }
        
        .nav-center-bump.hidden-bump {
            transform: translateX(-50%) translateY(80px);
            opacity: 0;
            pointer-events: none;
        }

        .nav-center-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 4px solid #F4F1DE; 
            cursor: default; 
        }
        
        body.is-home .nav-center-btn {
            border-color: #1a1a1a;
        }
    </style>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>
</head>

<body class="text-slate-700 antialiased opacity-0 transition-opacity duration-500" onload="document.body.classList.remove('opacity-0')"> 
    
    <header class="fixed top-0 left-0 right-0 z-50 pointer-events-none"></header>

    <main id="app-content" class="max-w-2xl mx-auto px-4 pt-4 min-h-[100dvh] pb-32">
        <div id="data-container" class="flex flex-col items-center justify-center h-[80vh]">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 bg-ct-yellow rounded-full animate-ping opacity-30"></div>
                <div class="relative bg-white p-3 rounded-full shadow-soft border-2 border-ct-terracotta">
                    <span class="material-icons text-2xl text-ct-terracotta">explore</span>
                </div>
            </div>
            <p class="font-bold text-primary mt-4 uppercase tracking-widest text-xs opacity-60">Caricamento...</p>
        </div>    
    </main>

    <nav id="bottom-nav" class="fixed bottom-4 left-4 right-4 h-16 bg-white/95 backdrop-blur-xl rounded-2xl shadow-floating flex justify-between items-center z-50 px-1 border border-white/50 pb-[env(safe-area-inset-bottom)]">
        
        <div class="flex flex-1 justify-around items-center h-full">
            <button class="nav-item group flex flex-col items-center justify-center w-12 h-full transition-all relative" onclick="switchView('home', this)">
                <span class="material-icons text-[24px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-green group-[.active]:-translate-y-2">home</span>
                <span class="text-[9px] font-bold text-slate-300 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-green nav-label absolute bottom-2 uppercase tracking-wide">Home</span>
            </button>
            <button class="nav-item group flex flex-col items-center justify-center w-12 h-full transition-all relative" onclick="switchView('cibo', this)">
                <span class="material-icons text-[22px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-terracotta group-[.active]:-translate-y-2">restaurant</span>
                <span class="text-[9px] font-bold text-slate-300 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-terracotta nav-label absolute bottom-2 uppercase tracking-wide">Cibo</span>
            </button>
        </div>

        <div class="relative w-12 h-full flex justify-center z-50 pointer-events-none">
            <div id="center-lang-btn-wrapper" class="nav-center-bump">
                <div class="nav-center-btn">
                    <span id="nav-lang-flag" class="text-2xl filter drop-shadow-sm leading-none pt-0.5">🇮🇹</span>
                </div>
            </div>
        </div>

        <div class="flex flex-1 justify-around items-center h-full">
            <button class="nav-item group flex flex-col items-center justify-center w-12 h-full transition-all relative" onclick="switchView('outdoor', this)">
                <span class="material-icons text-[22px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-yellow group-[.active]:-translate-y-2">hiking</span>
                <span class="text-[9px] font-bold text-slate-300 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-yellow nav-label absolute bottom-2 uppercase tracking-wide">Outdoor</span>
            </button>
            <button class="nav-item group flex flex-col items-center justify-center w-12 h-full transition-all relative" onclick="switchView('servizi', this)">
                <span class="material-icons text-[22px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-blue group-[.active]:-translate-y-2">grid_view</span>
                <span class="text-[9px] font-bold text-slate-300 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-blue nav-label absolute bottom-2 uppercase tracking-wide">Servizi</span>
            </button>
        </div>

    </nav>

    <script src="./data-logic.js" defer></script>
    <script src="./ui-renderers.js" defer></script>
    <script src="./legal-render.js" defer></script>
    <script src="./ui-modal-contents.js" defer></script> 
    <script src="./ui-modal.js" defer></script> 
    <script src="./app.js" defer></script>

    <a href="#" id="ghost-cookie-btn" class="lb-cs-settings-link hidden"></a>
    <script type="text/javascript" src="https://app.legalblink.it/api/scripts/lb_cs.js" defer></script>
    <script id="lb_cs" type="text/javascript">
        // FIX: Avviare LegalBlink solo dopo caricamento DOM
        document.addEventListener("DOMContentLoaded", function() {
            if(typeof lb_cs === "function") {
                lb_cs("6973df3d9398e90022bdb48d");
            }
        });
    </script>
</body> 
</html>
