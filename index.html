<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Five2Go</title>

    <!-- PWA Manifest + meta cross-browser -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#264653">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Five2Go">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.min.css" />

    <!-- Material Icons only – Phosphor and Font Awesome removed -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Roboto Slab"', 'serif'],
                    },
                    colors: {
                        primary: '#264653',
                        'ct-terracotta': '#E76F51',
                        'ct-terracotta-light': '#FFEDE1',
                        'ct-yellow': '#E9C46A',
                        'ct-yellow-light': '#FFFBEB',
                        'ct-blue': '#2A9D8F',
                        'ct-blue-light': '#E0F7FA',
                        'ct-green': '#606C38',
                        'ct-green-light': '#ECFCCB',
                        'ct-sand': '#F4F1DE',
                        surface: '#FFFFFF',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -5px rgba(0,0,0,0.1)',
                        'floating': '0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05)',
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2.5rem',
                    }
                }
            }
        }
    </script>

    <style>
        /* 1. BLOCCO TOTALE DELLA PAGINA */
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            overflow: hidden;
            position: fixed;
            background-color: #F4F1DE;
            color: #264653;
            touch-action: none;
            /* Fix scroll rimbalzante su Firefox Android */
            overscroll-behavior: none;
            /* Rimuove il flash grigio al tap su Android Chrome */
            -webkit-tap-highlight-color: transparent;
        }

        /* 2. AREA DI SCROLL INTERNA */
        #app-content {
            height: 100%; width: 100%;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 120px;
            position: relative; z-index: 10;
            scroll-behavior: smooth;
        }

        /* Nascondi scrollbar */
        .no-scrollbar::-webkit-scrollbar,
        #app-content::-webkit-scrollbar { display: none; }
        .no-scrollbar, #app-content { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes popIn {
            0%   { opacity: 0; transform: translateY(10px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* BUMP CENTRALE */
        .nav-center-bump {
            position: absolute; top: -24px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            z-index: 60;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
        }
        .nav-center-bump.hidden-bump {
            transform: translateX(-50%) translateY(80px);
            opacity: 0; pointer-events: none;
        }
        .nav-center-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex; align-items: center; justify-content: center;
            border: 2.5px solid rgba(255,255,255,0.6);
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-center-btn:active {
            transform: scale(0.88);
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        #bump-lang-panel {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9002;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 -4px 32px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.04);
            overflow: hidden;
            min-width: 200px;
            animation: bumpPanelIn 0.28s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes bumpPanelIn {
            from { opacity:0; transform:translateX(-50%) translateY(12px) scale(0.94); }
            to   { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
        }

        /* Search results sheet scrollbar */
        #search-results-sheet {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #search-results-sheet::-webkit-scrollbar { display: none; }

        /* Keyword highlight */
        mark { background: rgba(252,211,77,0.45); border-radius: 3px; padding: 0 2px; color: inherit; font-style: inherit; }

        /* Loading bar animation */
        @keyframes loadingBar {
            0%   { transform: translateX(-100%); width: 40%; }
            50%  { transform: translateX(150%);  width: 60%; }
            100% { transform: translateX(300%);  width: 40%; }
        }


        /* Splash → Home fade transition */
        #splash-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: #F4F1DE;
            pointer-events: none;
            transition: opacity 0.55s cubic-bezier(0.4,0,0.2,1);
        }
        #splash-overlay.fade-out { opacity: 0; }
        #splash-overlay.gone { display: none; }
        /* Nav labels: minimum 11px */
        .nav-label { font-size: 11px; }

        /* ── ANIMAZIONI MANCANTI ── */

        /* .spin: usata da loader e icone di caricamento in tutti i file JS */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .spin { animation: spin 1s linear infinite; display: inline-block; }

        /* animate-fade: usata per l'apparizione di contenuti dinamici */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.35s ease-out forwards; }

        /* ── CROSS-BROWSER FIXES ── */

        /* Fix 1: Nasconde il pulsante X nativo dell'input search su Chrome/Safari/Edge */
        input[type="search"]::-webkit-search-decoration,
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-results-button,
        input[type="search"]::-webkit-search-results-decoration { display: none; }
        /* Firefox */
        input[type="search"] { -moz-appearance: none; appearance: none; }

        /* Fix 2: Fallback opaco per browser senza backdrop-filter (Firefox < 103, alcuni Android) */
        @supports not (backdrop-filter: blur(1px)) {
            #bottom-nav { background: rgba(255,255,255,0.98) !important; }
            .nav-sticky-header { background: #F4F1DE !important; }
            #search-results-sheet { background: #ffffff !important; }
            .smart-filter-bar-container button { background: rgba(255,255,255,0.98) !important; }
        }

        /* ── Sticky tab bar: 100% opaca, full-bleed ──
           - background opaco (#F4F1DE) copre tutto il contenuto sotto
           - -mx-4 annulla il px-4 del genitore → copertura full-width
           - pb usato al posto di mb perché il padding è coperto dal bg,
             il margin no (ecco perché prima si vedevano le card sotto!)
           - box-shadow morbida in basso per dare profondità senza gradient */
        .nav-sticky-header {
            background: #F4F1DE !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            margin-left: -16px;
            margin-right: -16px;
            padding-left: 16px;
            padding-right: 16px;
            box-shadow: 0 4px 12px -2px rgba(0,0,0,0.06);
        }

        /* ── Filter bar secondaria: stessa logica full-bleed + opaca ── */
        .smart-filter-bar-container {
            background: #F4F1DE;
            padding-top: 4px;
            padding-bottom: 4px;
            box-shadow: 0 3px 8px -2px rgba(0,0,0,0.05);
        }

        /* ══════════════════════════════════════════════════════════
           HOME V2 — Landing Page
           Layout moderno: flex-col fullscreen con gradiente immersivo.
             body (position:fixed) → immagine di sfondo
             #app-content → trasparente, scroll interno
             .home-v2 → flex-col, occupa l'intera altezza viewport
               ├── .home-hero-central → titolo centrato (flex-1)
               └── .home-actions   → 3 pill glass in basso
           ══════════════════════════════════════════════════════════ */

        .home-v2 {
            display: flex;
            flex-direction: column;
            /* Fallback per browser senza dvh */
            min-height: calc(100vh - 160px);
            /* dvh = dynamic viewport height, esclude la barra browser su mobile */
            min-height: calc(100dvh - 100px);
            padding: 0;
        }

        /* ── Hero central: contenuto centrato verticalmente ── */
        .home-hero-central {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0 28px 32px;
            gap: 0;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.72) 0%,
                rgba(0,0,0,0.42) 40%,
                rgba(0,0,0,0.08) 70%,
                transparent 100%
            );
        }

        /* Label "CINQUE TERRE" sopra il titolo */
        .home-location-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #E9C46A;
            margin-bottom: 12px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }
        .home-location-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #E9C46A;
            box-shadow: 0 0 8px rgba(233,196,106,0.6);
            flex-shrink: 0;
        }

        /* Titolo principale: "Five" + "2Go" sulla stessa riga */
        .home-title {
            font-family: "Playfair Display", "Roboto Slab", serif;
            font-size: clamp(3.6rem, 15vw, 5rem);
            font-weight: 900;
            line-height: 0.92;
            letter-spacing: -0.03em;
            margin: 0 0 14px 0;
        }
        /* "Five" — corsivo dorato */
        .home-title-five {
            font-style: italic;
            color: #E9C46A;
            text-shadow: 0 2px 20px rgba(233,196,106,0.35), 0 4px 30px rgba(0,0,0,0.45);
        }
        /* "2Go" — bianco solido */
        .home-title-2go {
            font-style: normal;
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0,0,0,0.45);
        }

        /* Sottotitolo / tagline */
        .home-tagline {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.60);
            line-height: 1.6;
            max-width: 300px;
            letter-spacing: 0.01em;
        }

        /* ── Search bar glass ── */
        .home-search-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 20px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 16px;
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            padding: 0 14px;
            height: 48px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.10);
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .home-search-wrap:focus-within {
            background: rgba(255,255,255,0.20);
            border-color: rgba(255,255,255,0.35);
            box-shadow: 0 4px 24px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .home-search-icon {
            font-size: 20px;
            color: rgba(255,255,255,0.45);
            flex-shrink: 0;
            margin-right: 10px;
            pointer-events: none;
        }
        .home-search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.92);
            letter-spacing: 0.01em;
            min-width: 0;
        }
        .home-search-input::placeholder {
            color: rgba(255,255,255,0.35);
            font-weight: 500;
        }
        .home-search-clear {
            flex-shrink: 0;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.70);
            cursor: pointer;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .home-search-clear:active {
            background: rgba(255,255,255,0.30);
        }

        /* ── Actions: 3 pill glass in basso ── */
        .home-actions {
            padding: 0 16px 28px;
            display: flex;
            gap: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.55) 60%, transparent 100%);
        }

        .home-pill {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 10px;
            border-radius: 50px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.22);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            cursor: pointer;
            transition: background 0.20s ease, transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.20s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.15);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .home-pill:active {
            transform: scale(0.93);
            background: rgba(255,255,255,0.22);
            box-shadow: 0 2px 8px rgba(0,0,0,0.20);
        }
        .home-pill--heart .home-pill-icon { color: #fb7185 !important; }
        .home-pill--itin  .home-pill-icon { color: #fbbf24 !important; }
        .home-pill--map   .home-pill-icon { color: #5eead4 !important; }
        .home-pill-icon {
            font-size: 18px !important;
            color: rgba(255,255,255,0.90);
            flex-shrink: 0;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.30));
        }
        .home-pill-label {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.88);
            white-space: nowrap;
        }
        .home-pill-badge {
            position: absolute;
            top: -5px; right: -2px;
            background: #E76F51;
            color: #fff;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 9px;
            font-weight: 900;
            min-width: 18px;
            height: 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(231,111,81,0.60);
            border: 1.5px solid rgba(255,255,255,0.30);
        }

        /* ── Alias retrocompatibilità ── */
        .home-quick-row     { display: none !important; }
        .home-section-label { display: none !important; }
        .home-grid          { display: none !important; }
        [data-home-badge]   { }

        /* ── Near Me button nella filter bar ── */
        .near-me-btn {
            flex-shrink: 0;
            width: 42px; height: 42px;
            border-radius: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            color: #94a3b8;
            -webkit-tap-highlight-color: transparent;
        }
        .near-me-btn.active-near-me {
            background: #2A9D8F;
            border-color: #2A9D8F;
            color: white;
        }

        /* ── Offline badge persistente ── */
        .offline-badge {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9000;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #264653;
            color: rgba(255,255,255,0.92);
            padding: 7px 16px;
            border-radius: 50px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            pointer-events: none;
            transition: opacity 0.4s ease;
            animation: offlineBadgeIn 0.35s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes offlineBadgeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>
</head>

<body class="text-slate-700 antialiased pb-28">
<div id="splash-overlay"></div>
<header class="fixed top-0 left-0 right-0 z-50 pointer-events-none"></header>

<main id="app-content" class="max-w-2xl mx-auto px-4 pt-4 min-h-screen">
    <!-- ── SCHERMATA DI AVVIO / LOADING ── -->
    <div id="data-container" class="flex flex-col items-center justify-center px-8" style="height:80vh;height:80dvh;">

        <!-- Icona pulsante -->
        <div class="relative w-16 h-16 mb-5">
            <div class="absolute inset-0 bg-ct-yellow rounded-full animate-ping opacity-30"></div>
            <div class="relative bg-white p-3 rounded-full shadow-soft border-2 border-ct-terracotta flex items-center justify-center">
                <span class="material-icons text-2xl text-ct-terracotta">explore</span>
            </div>
        </div>

        <!-- Step text -->
        <p id="loading-step" class="font-bold text-primary uppercase tracking-widest text-[11px] opacity-60 text-center mb-4">
            Connessione in corso...
        </p>

        <!-- Barra di progresso indeterminata -->
        <div id="loading-bar-wrap" class="w-48 h-1 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-ct-terracotta rounded-full" style="animation: loadingBar 1.4s ease-in-out infinite;"></div>
        </div>

        <!-- Stato errore di rete (nascosto di default) -->
        <p id="loading-error" class="hidden mt-6 text-center">
            <span class="material-icons text-3xl text-slate-400 block mb-2">wifi_off</span>
            <span class="text-sm font-bold text-slate-500 block mb-1">Connessione assente</span>
            <span class="text-[11px] text-slate-400 block mb-4">Controlla la rete e riprova</span>
            <button onclick="location.reload()"
                class="bg-ct-terracotta text-white text-[11px] font-bold uppercase tracking-widest px-5 py-2.5 rounded-2xl active:scale-95 transition-transform shadow-md">
                Riprova
            </button>
        </p>
    </div>
</main>

<nav id="bottom-nav" class="fixed bottom-4 left-4 right-4 h-16 bg-white/95 backdrop-blur-xl rounded-2xl shadow-floating flex justify-between items-center z-50 px-1 border border-white/50">

    <div class="flex flex-1 justify-around items-center h-full">
        <button class="nav-item group flex flex-col items-center justify-center w-12 h-full transition-all relative" onclick="switchView('home', this)">
            <span class="material-icons text-[24px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-green group-[.active]:-translate-y-2">home</span>
            <span class="nav-label font-bold text-slate-300 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-green nav-label absolute bottom-2 uppercase tracking-wide">Home</span>
        </button>
        <button class="nav-item group flex flex-col items-center justify-center w-12 h-full transition-all relative" onclick="switchView('cibo', this)">
            <span class="material-icons text-[22px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-terracotta group-[.active]:-translate-y-2">restaurant</span>
            <span class="nav-label font-bold text-slate-300 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-terracotta nav-label absolute bottom-2 uppercase tracking-wide">Cibo</span>
        </button>
    </div>

    <div class="relative w-12 h-full flex justify-center z-50">
        <div id="center-lang-btn-wrapper" class="nav-center-bump">
            <button class="nav-center-btn"
                onclick="window._toggleBumpLangPanel()"
                aria-label="Cambia lingua"
                aria-haspopup="true"
                aria-expanded="false"
                id="bump-lang-trigger">
                <span id="nav-lang-flag" class="text-2xl filter drop-shadow-sm leading-none pt-0.5">🇮🇹</span>
            </button>
        </div>
    </div>

    <div class="flex flex-1 justify-around items-center h-full">
        <button class="nav-item group flex flex-col items-center justify-center w-12 h-full transition-all relative" onclick="switchView('outdoor', this)">
            <span class="material-icons text-[22px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-yellow group-[.active]:-translate-y-2">hiking</span>

<script>
// ── Registrazione Service Worker ──────────────────────────────────────────
// Il SW è necessario per due cose:
//   1. Offline support: intercetta le richieste di rete e serve asset/dati
//      dalla CacheStorage quando non c'è connessione.
//   2. Installabilità PWA: Chrome/Safari richiedono un SW attivo per mostrare
//      il banner "Aggiungi alla schermata home".
// La registrazione avviene su 'load' (non DOMContentLoaded) per non ritardare
// il rendering iniziale dell'app.
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .catch(err => console.warn('[SW] Registrazione fallita:', err));
    });
}
</script>
