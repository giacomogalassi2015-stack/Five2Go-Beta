<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five2Go</title>

    <!-- PWA Manifest + meta cross-browser -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3D4246">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Five2Go">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.min.css" />

    <!-- Material Icons only – Phosphor and Font Awesome removed -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Roboto Slab"', 'serif'],
                    },
                    colors: {
                        /* ── Palette Serenità Cinque Terre ──
                           Ogni colore è pensato per evocare il territorio
                           e ridurre la pressione cognitiva del turista. */

                        primary: '#3D4246',              /* Ardesia scuro — testi principali */
                        'primary-deep': '#264653',       /* Blu profondo legacy — header/nav accent */

                        /* Cibo: terra, sole, convivialità */
                        'ct-terracotta': '#C98A5F',      /* Terracotta polveroso — prodotti */
                        'ct-terracotta-light': '#F5E6D8', /* Terracotta sfumato — bg card */
                        'ct-yellow': '#E9C46A',          /* Ocra pallido — ristoranti */
                        'ct-yellow-light': '#FBF5E4',    /* Ocra sfumato — bg card */
                        'ct-wine': '#8B5E5E',            /* Borgogna spento — vini */
                        'ct-wine-light': '#F2E8E8',      /* Borgogna sfumato — bg card */

                        /* Outdoor: macchia mediterranea, mare calmo */
                        'ct-sage': '#768E6B',            /* Verde salvia — sentieri, attrazioni */
                        'ct-sage-light': '#E8EDE5',      /* Salvia sfumato — bg card */
                        'ct-shore': '#7097A8',           /* Azzurro cenere — spiagge */
                        'ct-shore-light': '#E4EEF2',     /* Azzurro sfumato — bg card */

                        /* Servizi: cura, affidabilità */
                        'ct-health': '#8DAA91',          /* Verde veronese — farmacie, emergenza */
                        'ct-health-light': '#E6EEE7',    /* Verde veronese sfumato */
                        'ct-service': '#5E7A8C',         /* Blu oltremare opaco — treno, trekking */
                        'ct-service-light': '#E1E9EE',   /* Blu oltremare sfumato */

                        /* Neutri */
                        'ct-sand': '#F5F1E1',            /* Sabbia — sfondo globale */
                        'ct-cream-dark': '#D6CFC1',      /* Crema scuro — bordi soft, info btn */
                        surface: '#FFFFFF',

                        /* Legacy aliases (per non rompere nulla) */
                        'ct-blue': '#7097A8',            /* Rimappato → shore */
                        'ct-blue-light': '#E4EEF2',
                        'ct-green': '#768E6B',           /* Rimappato → sage */
                        'ct-green-light': '#E8EDE5',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -5px rgba(0,0,0,0.08)',
                        'floating': '0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04)',
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2.5rem',
                    },
                    transitionDuration: {
                        DEFAULT: '300ms',
                    }
                }
            }
        }
    </script>

    <style>
        /* 1. BLOCCO TOTALE DELLA PAGINA */
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            overflow: hidden;
            position: fixed;
            background-color: #F5F1E1;
            color: #3D4246;
            /* touch-action:manipulation consente pinch-zoom (accessibilità)
               ma previene il double-tap zoom che causa delay e problemi UX.
               Era touch-action:none che bloccava TUTTO → violazione WCAG 2.1 SC 1.4.4 */
            touch-action: manipulation;
            /* Fix scroll rimbalzante su Firefox Android */
            overscroll-behavior: none;
            /* Rimuove il flash grigio al tap su Android Chrome */
            -webkit-tap-highlight-color: transparent;
        }

        /* 2. AREA DI SCROLL INTERNA */
        #app-content {
            height: 100%; width: 100%;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 120px;
            position: relative; z-index: 10;
            scroll-behavior: smooth;
        }

        /* ── HOME: Overlay gradiente FULL-VIEWPORT ──
           Perché su ::after del body e non su .home-v2?
           → L'immagine di sfondo è sul body (position:fixed, cover).
           → .home-v2 sta dentro #app-content che ha pt-4, px-4, max-w-2xl
              → NON copre l'intera viewport (gap in alto, ai lati, in basso).
           → body::after è position:fixed inset:0 → copre TUTTO, pixel per pixel.
           → z-index:1 lo mette sopra il bg ma sotto #app-content (z-index:10).
           
           Il gradiente è cinematografico: velo leggero in alto per far respirare
           la foto, si intensifica verso il basso per garantire leggibilità
           di titolo, tagline, search bar e pill buttons. */
        body.is-home::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.15) 0%,
                rgba(0,0,0,0.18) 10%,
                rgba(0,0,0,0.25) 25%,
                rgba(0,0,0,0.38) 42%,
                rgba(0,0,0,0.55) 58%,
                rgba(0,0,0,0.70) 74%,
                rgba(0,0,0,0.80) 88%,
                rgba(0,0,0,0.88) 100%
            );
        }
        /* Sulla home: rimuovi padding-top per layout immersivo edge-to-edge.
           Il pt-4 serve alle view con contenuti (cibo, outdoor, servizi)
           ma la landing page deve usare tutta la viewport. */
        body.is-home #app-content {
            padding-top: 0;
        }

        /* Nascondi scrollbar */
        .no-scrollbar::-webkit-scrollbar,
        #app-content::-webkit-scrollbar { display: none; }
        .no-scrollbar, #app-content { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes popIn {
            0%   { opacity: 0; transform: translateY(10px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* BUMP CENTRALE */
        .nav-center-bump {
            position: absolute; top: -24px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            z-index: 60;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
        }
        .nav-center-bump.hidden-bump {
            transform: translateX(-50%) translateY(80px);
            opacity: 0; pointer-events: none;
        }
        .nav-center-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex; align-items: center; justify-content: center;
            border: 2.5px solid rgba(255,255,255,0.6);
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-center-btn:active {
            transform: scale(0.88);
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        /* ── BADGE TRANSLATE sull'icona lingua ── */
        .lang-btn-inner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .lang-translate-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3D4246;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.18);
            pointer-events: none;
        }
        .lang-translate-badge .material-icons {
            font-size: 11px;
            color: #fff;
            line-height: 1;
        }

        #bump-lang-panel {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9002;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 -4px 32px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.04);
            overflow: hidden;
            min-width: 200px;
            animation: bumpPanelIn 0.28s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes bumpPanelIn {
            from { opacity:0; transform:translateX(-50%) translateY(12px) scale(0.94); }
            to   { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
        }

        /* Search results sheet scrollbar */
        #search-results-sheet {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #search-results-sheet::-webkit-scrollbar { display: none; }

        /* Keyword highlight */
        mark { background: rgba(252,211,77,0.45); border-radius: 3px; padding: 0 2px; color: inherit; font-style: inherit; }

        /* Loading bar animation */
        @keyframes loadingBar {
            0%   { transform: translateX(-100%); width: 40%; }
            50%  { transform: translateX(150%);  width: 60%; }
            100% { transform: translateX(300%);  width: 40%; }
        }


        /* Splash → Home fade transition */
        #splash-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: #F5F1E1;
            pointer-events: none;
            transition: opacity 0.55s cubic-bezier(0.4,0,0.2,1);
        }
        #splash-overlay.fade-out { opacity: 0; }
        #splash-overlay.gone { display: none; }
        /* Nav labels: minimum 11px */
        .nav-label { font-size: 11px; }

        /* ── ANIMAZIONI MANCANTI ── */

        /* .spin: usata da loader e icone di caricamento in tutti i file JS */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .spin { animation: spin 1s linear infinite; display: inline-block; }

        /* animate-fade: usata per l'apparizione di contenuti dinamici */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.35s ease-out forwards; }

        /* ── CROSS-BROWSER FIXES ── */

        /* Fix 1: Nasconde il pulsante X nativo dell'input search su Chrome/Safari/Edge */
        input[type="search"]::-webkit-search-decoration,
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-results-button,
        input[type="search"]::-webkit-search-results-decoration { display: none; }
        /* Firefox */
        input[type="search"] { -moz-appearance: none; appearance: none; }

        /* Fix 2: Fallback opaco per browser senza backdrop-filter (Firefox < 103, alcuni Android) */
        @supports not (backdrop-filter: blur(1px)) {
            #bottom-nav { background: rgba(255,255,255,0.98) !important; }
            .nav-sticky-header { background: #F5F1E1 !important; }
            #search-results-sheet { background: #ffffff !important; }
            .smart-filter-bar-container button { background: rgba(255,255,255,0.98) !important; }
        }

        /* ── Sticky tab bar: rimosso sticky, ora è contenuto statico ──
           I FAB flottanti sostituiscono lo sticky: zero bug visivi,
           più spazio verticale, UX thumb-friendly */
        .nav-sticky-header {
            background: #F5F1E1;
        }

        /* ── Filter bar: anche questa ora è statica ── */
       /* ── Filter bar: statica e riallineata in alto ── */
        .smart-filter-bar-container {
            background: #F5F1E1;
            padding-top: 0px;
            padding-bottom: 8px;
            margin-top: -12px; /* Compensa il padding predefinito (pt-4) del main */
        }

        /* ── FAB flottanti (filtro + scroll-to-top) ──
           Appaiono quando l'utente scrolla oltre il tab bar.
           Posizionati a destra, sopra la bottom nav.
           Pattern usato da Google Maps, Zalando, Deliveroo. */
        .fab-scroll-actions {
            position: fixed;
            right: 16px;
            bottom: 90px;
            z-index: 45;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: none;
            /* Transizione globale per tutto il gruppo */
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .fab-scroll-actions.fab-hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            pointer-events: none;
        }
        .fab-scroll-actions.fab-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .fab-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18), 0 1px 4px rgba(0,0,0,0.08);
            transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .fab-btn:active {
            transform: scale(0.88);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .fab-btn--top {
            background: white;
            color: #3D4246;
        }
        .fab-btn--filter {
            background: #3D4246;
            color: white;
        }

        /* ══════════════════════════════════════════════════════════
           HOME V2 — Landing Page
           Layout moderno: flex-col fullscreen con gradiente immersivo.
             body (position:fixed) → immagine di sfondo
             #app-content → trasparente, scroll interno
             .home-v2 → flex-col, occupa l'intera altezza viewport
               ├── .home-hero-central → titolo centrato (flex-1)
               └── .home-actions   → 3 pill glass in basso
           ══════════════════════════════════════════════════════════ */

        .home-v2 {
            display: flex;
            flex-direction: column;
            /* Fallback per browser senza dvh */
            min-height: calc(100vh - 160px);
            /* dvh = dynamic viewport height, esclude la barra browser su mobile */
            min-height: calc(100dvh - 100px);
            padding: 0;
            /* Gradiente rimosso da qui — ora gestito da body.is-home::after
               che copre l'intera viewport senza gap (vedi sopra).
               .home-v2 resta trasparente: solo layout flex-col. */
        }

        /* ── Hero central: contenuto centrato verticalmente ── */
        .home-hero-central {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0 28px 32px;
            gap: 0;
            /* Gradiente rimosso — gestito dal padre .home-v2 */
        }

        /* Label "CINQUE TERRE" sopra il titolo */
        .home-location-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #E9C46A;
            margin-bottom: 12px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }
        .home-location-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #E9C46A;
            box-shadow: 0 0 8px rgba(233,196,106,0.6);
            flex-shrink: 0;
        }

        /* Titolo principale: "Five" + "2Go" sulla stessa riga */
        .home-title {
            font-family: "Playfair Display", "Roboto Slab", serif;
            font-size: clamp(3.6rem, 15vw, 5rem);
            font-weight: 900;
            line-height: 0.92;
            letter-spacing: -0.03em;
            margin: 0 0 14px 0;
        }
        /* "Five" — corsivo dorato */
        .home-title-five {
            font-style: italic;
            color: #E9C46A;
            text-shadow: 0 2px 20px rgba(233,196,106,0.35), 0 4px 30px rgba(0,0,0,0.45);
        }
        /* "2Go" — bianco solido */
        .home-title-2go {
            font-style: normal;
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0,0,0,0.45);
        }

        /* Sottotitolo / tagline */
        .home-tagline {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.80);
            line-height: 1.6;
            max-width: 300px;
            letter-spacing: 0.01em;
        }

        /* ── Search bar glass ── */
        .home-search-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 20px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 16px;
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            padding: 0 14px;
            height: 48px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.10);
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .home-search-wrap:focus-within {
            background: rgba(255,255,255,0.20);
            border-color: rgba(255,255,255,0.35);
            box-shadow: 0 4px 24px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .home-search-icon {
            font-size: 20px;
            color: rgba(255,255,255,0.60);
            flex-shrink: 0;
            margin-right: 10px;
            pointer-events: none;
        }
        .home-search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: "Plus Jakarta Sans", sans-serif;
            /* 16px è il minimo per evitare l'auto-zoom di iOS Safari al focus.
               Con 13px iOS ingrandiva la viewport, rompendo il layout. */
            font-size: 16px;
            font-weight: 500;
            color: rgba(255,255,255,0.92);
            letter-spacing: 0.01em;
            min-width: 0;
        }
        .home-search-input::placeholder {
            color: rgba(255,255,255,0.50);
            font-weight: 500;
        }
        .home-search-clear {
            flex-shrink: 0;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.70);
            cursor: pointer;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .home-search-clear:active {
            background: rgba(255,255,255,0.30);
        }

        /* ══════════════════════════════════════════════════════════
           OVERSCROLL PEEK — Nav bar "sveglia" alla fine della home
           Quando l'utente swipa verso l'alto dalla landing page,
           la nav bar rivela tutte le label per invitare all'esplorazione.
           Usato SOLO sulla home view, attivato via JS touch handler.
           ══════════════════════════════════════════════════════════ */

        /* Transizione base della nav — sempre attiva per smooth reset */
        #bottom-nav {
            transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1),
                        box-shadow 0.5s ease;
        }

        /* Stato peek: nav si solleva con glow sottile */
        #bottom-nav.nav-peek {
            transform: translateY(-12px);
            box-shadow: 0 -2px 30px rgba(112,151,168,0.15),
                        0 8px 40px rgba(0,0,0,0.18);
        }

        /* ── TUTTE le icone: pop 3D verso l'utente ── */
        #bottom-nav.nav-peek .nav-item .material-icons {
            transform: translateY(-10px) scale(1.25);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
            transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1),
                        filter 0.4s ease,
                        color 0.3s ease;
        }
        /* Icone non-attive: diventano visibili */
        #bottom-nav.nav-peek .nav-item:not(.active) .material-icons {
            color: #64748b;
        }
        /* Stagger sulle icone: onda dal centro verso i lati */
        #bottom-nav.nav-peek .nav-item:nth-child(1) .material-icons { transition-delay: 0.06s; }
        #bottom-nav.nav-peek .nav-item:nth-child(2) .material-icons { transition-delay: 0.03s; }
        #bottom-nav.nav-peek .nav-item:nth-child(3) .material-icons { transition-delay: 0.03s; }
        #bottom-nav.nav-peek .nav-item:nth-child(4) .material-icons { transition-delay: 0.06s; }

        /* Label non-attive: appaiono con stagger via transition-delay */
        #bottom-nav.nav-peek .nav-item:not(.active) .nav-label {
            opacity: 1;
            color: #64748b;
            transition: opacity 0.35s ease;
        }
        /* Stagger label: onda leggera */
        #bottom-nav.nav-peek .nav-item:nth-child(2):not(.active) .nav-label { transition-delay: 0.05s; }
        #bottom-nav.nav-peek .nav-item:nth-child(3):not(.active) .nav-label { transition-delay: 0.08s; }
        #bottom-nav.nav-peek .nav-item:nth-child(4):not(.active) .nav-label { transition-delay: 0.11s; }

        /* ── Reset: quando nav-peek viene rimosso ── */
        #bottom-nav:not(.nav-peek) .nav-item:not(.active) .nav-label {
            transition: opacity 0.2s ease;
        }
        #bottom-nav:not(.nav-peek) .nav-item .material-icons {
            filter: none;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.05s,
                        filter 0.3s ease,
                        color 0.3s ease;
        }

        /* Elasticità del contenuto — applicata via JS inline transform */
        #app-content.overscroll-active {
            will-change: transform;
        }

        /* ── Actions: 3 pill glass in basso ── */
        .home-actions {
            padding: 0 16px 28px;
            display: flex;
            gap: 10px;
            /* Gradiente rimosso — gestito dal padre .home-v2 */
        }

        .home-pill {
            flex: 1;
            position: relative;

            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;

            white-space: nowrap;
        }
        .home-pill-badge {
            position: absolute;
            top: -5px; right: -2px;
            background: #C98A5F;
            color: #fff;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 9px;
            font-weight: 900;
            min-width: 18px;
            height: 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;

        /* ── Alias retrocompatibilità ── */
        .home-quick-row     { display: none !important; }
        .home-section-label { display: none !important; }
        .home-grid          { display: none !important; }
        [data-home-badge]   { }

       /* ══════════════════════════════════════════════════════════
           CHICCO — Mascotte "seduta sulla barra"
           ══════════════════════════════════════════════════════════ */
        .chicco-fab {
            position: fixed;
            left: 14px;
            bottom: 82px; /* Sollevato per poggiare perfettamente sopra la nav bar */
            z-index: 100; /* Superiore a z-index: 50 della barra di navigazione */
            pointer-events: auto;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
        }
        .chicco-fab.chicco-hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.7);
            pointer-events: none;
        }
        .chicco-fab-btn {
            width: 76px; /* Aumentato (era 56px) */
            height: 76px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: relative;
            padding: 0;
            overflow: visible;
        }
        .chicco-fab-btn:active {
            transform: scale(0.85);
        }
        .chicco-fab.chicco-talking .chicco-fab-btn {
            transform: scale(1.3);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        .chicco-fab-img {
            width: 76px;
            height: 76px;
            object-fit: contain;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
            pointer-events: none;
        }
        .chicco-fab-lottie {
            position: absolute;
            inset: -4px;
            width: 84px; /* Aumentato proporzionalmente */
            height: 84px;
            pointer-events: none;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
        }

        /* ── Speech bubble di benvenuto ──
           Posizionata fixed sopra il FAB di Chicco.
           Appesa al body, non al FAB — così non blocca il tap.
           Cliccabile: tap sulla bubble = tap su Chicco. */
        .chicco-bubble {
            position: fixed;
            bottom: 164px;   /* Chicco FAB bottom(82px) + FAB height(76px) + gap(6px) */
            left: 14px;
            z-index: 101;    /* Sopra il FAB (z:100) */
            background: white;
            color: #3D4246;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            padding: 10px 14px;
            border-radius: 16px 16px 16px 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15), 0 1px 4px rgba(0,0,0,0.08);
            max-width: 220px;
            white-space: normal;
            pointer-events: auto;
            cursor: pointer;
            /* Animazione entrata: appare dopo un delay */
            opacity: 0;
            animation: chicco-bubble-in 0.45s cubic-bezier(0.34,1.56,0.64,1) 1.5s forwards;
        }
        /* Triangolino del fumetto — punta verso Chicco */
        .chicco-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 16px;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 0 0 0 3px;
            transform: rotate(-45deg);
            box-shadow: -2px 2px 4px rgba(0,0,0,0.06);
        }
        /* Uscita: si dissolve */
        .chicco-bubble.bubble-out {
            animation: chicco-bubble-out 0.3s ease forwards !important;
        }
        @keyframes chicco-bubble-in {
            0%   { opacity: 0; transform: translateY(6px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes chicco-bubble-out {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(4px) scale(0.95); }
        }

        /* Card meteo espansa */
        .chicco-card {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 104px; /* Alzata leggermente per compensare la mascotte più grande */
            z-index: 9003;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border-radius: 20px;
            box-shadow: 0 -4px 32px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.04);
            padding: 20px;
            max-width: 380px;
            animation: chiccoCardIn 0.3s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }

        @keyframes chiccoCardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* Header card con Chicco Lottie animato */
        .chicco-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .chicco-card-anim {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
        }
        .chicco-card-weather {
            font-size: 14px;
            color: #475569;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .chicco-card-advice {
            font-size: 13px;
            font-weight: 600;
            color: #3D4246;
            line-height: 1.5;
            padding: 12px 14px;
            background: #F5F1E1;
            border-radius: 12px;
            border-left: 3px solid #E9C46A;
        }
        .chicco-card-close {
            position: absolute;
            top: 12px; right: 12px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.06);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #94a3b8;
            -webkit-tap-highlight-color: transparent;
        }
        .chicco-card-close:active {
            background: rgba(0,0,0,0.12);
        }

        /* ── Near Me button nella filter bar ── */
        .near-me-btn {
            flex-shrink: 0;
            width: 42px; height: 42px;
            border-radius: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            color: #94a3b8;
            -webkit-tap-highlight-color: transparent;
        }
        .near-me-btn.active-near-me {
            background: #7097A8;
            border-color: #7097A8;
            color: white;
        }

        /* ── Offline badge persistente ── */
        .offline-badge {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9000;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #3D4246;
            color: rgba(255,255,255,0.92);
            padding: 7px 16px;
            border-radius: 50px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            pointer-events: none;
            transition: opacity 0.4s ease;
            animation: offlineBadgeIn 0.35s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes offlineBadgeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ══════════════════════════════════════════════════════════
           MOBILE-FIRST CARD SIZING
           Altezze immagine responsive in base al contesto:
           - Full-width (ristoranti, spiagge, attrazioni): 200px
           - Grid 2-col (prodotti): 140px — proporzionato alla larghezza
           - line-clamp per titoli lunghi (es. cinese/tedesco)
           ══════════════════════════════════════════════════════════ */

        /* Default: altezza immagine per card a larghezza piena */
        .master-card-img {
            height: 200px;
        }

        /* Dentro griglia 2-col: immagine più bassa, proporzionata */
        .grid-cols-2 .master-card-img {
            height: 140px;
        }

        /* Dentro griglia 2-col: rimuovi margin-bottom (il gap del grid basta) */
        .grid-cols-2 .master-card {
            margin-bottom: 0;
        }

        /* Card a larghezza piena (fuori dal grid): mantieni spacing */
        .master-card {
            margin-bottom: 16px;
        }

        /* Su schermi >= 640px: immagini un pelo più generose */
        @media (min-width: 640px) {
            .master-card-img { height: 224px; }
            .grid-cols-2 .master-card-img { height: 170px; }
        }

        /* ── CHIP nel banner azioni delle card ── */
        .mc-chip-bar {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: #f1f5f9;
            color: #475569;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            line-height: 1.2;
            white-space: nowrap;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Fallback per browser senza line-clamp nativo (raro, ma safety net) */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

    </style>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

</head>

<script>
// ── Registrazione Service Worker ──────────────────────────────────────────
// Il SW è necessario per due cose:
//   1. Offline support: intercetta le richieste di rete e serve asset/dati
//      dalla CacheStorage quando non c'è connessione.
//   2. Installabilità PWA: Chrome/Safari richiedono un SW attivo per mostrare
//      il banner "Aggiungi alla schermata home".
// La registrazione avviene su 'load' (non DOMContentLoaded) per non ritardare
// il rendering iniziale dell'app.
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .catch(err => console.warn('[SW] Registrazione fallita:', err));
    });
}
</script>
