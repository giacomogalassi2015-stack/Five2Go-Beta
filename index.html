<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Five2Go</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.min.css" />
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Roboto Slab"', 'serif'],
                    },
                    colors: {
                        primary: '#2A5B52',       
                        'primary-dark': '#1F423C',
                        'ct-yellow': '#E3B23C',   
                        'ct-yellow-light': '#FDF3D8',
                        'ct-terracotta': '#D66D50', 
                        'ct-terracotta-light': '#FCECE8',
                        'ct-blue': '#4A8FA3',     
                        'ct-blue-light': '#E6F4F7',
                        'ct-green': '#6B8E23',    
                        'ct-green-light': '#EFF5E6',
                        'ct-sand': '#F9F7F2',     
                        surface: '#FFFFFF',
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(42, 91, 82, 0.08)',
                        'card': '0 8px 24px -4px rgba(0,0,0,0.06)',
                    }
                }
            }
        }
    </script>

    <style>
        /* FIX SCROLL TOTALE: Blocca il rimbalzo su tutto il documento */
        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            overscroll-behavior-y: none; /* Blocca rimbalzo elastico verticale */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F9F7F2; /* ct-sand fallback */
        }
        
        /* Utilità Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animazioni */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script> 
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>
</head>

<body class="text-slate-700 antialiased pb-28">

    <header class="fixed top-0 left-0 right-0 z-50 pointer-events-none"></header>

    <main id="app-content" class="max-w-2xl mx-auto px-5 pt-6 min-h-screen">
        <div id="data-container" class="flex flex-col items-center justify-center h-[80vh] text-slate-400">
            <span class="material-icons animate-spin text-4xl mb-3 text-ct-yellow">sync</span>
            <p class="font-medium text-primary">Caricamento...</p>
        </div>    
    </main>

    <nav id="bottom-nav" class="fixed bottom-6 left-5 right-5 h-[72px] bg-white/95 backdrop-blur-xl border border-white/60 rounded-[2.5rem] shadow-xl shadow-slate-300/40 flex justify-around items-center z-50 max-w-md mx-auto transition-all duration-300">
        
        <button class="nav-item group flex-1 h-full flex flex-col items-center justify-center transition-all" onclick="switchView('home', this)">
            <span class="material-icons text-[28px] text-slate-300 transition-all duration-300 group-[.active]:text-primary group-[.active]:scale-110 group-[.active]:-translate-y-1">home</span>
            <span class="text-[10px] font-bold text-slate-300 mt-1 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-primary nav-label absolute bottom-3">Home</span>
        </button>

        <button class="nav-item group flex-1 h-full flex flex-col items-center justify-center transition-all" onclick="switchView('cibo', this)">
            <span class="material-icons text-[28px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-terracotta group-[.active]:scale-110 group-[.active]:-translate-y-1">restaurant</span>
            <span class="text-[10px] font-bold text-slate-300 mt-1 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-terracotta nav-label absolute bottom-3">Cibo</span>
        </button>

        <button class="nav-item group flex-1 h-full flex flex-col items-center justify-center transition-all" onclick="switchView('outdoor', this)">
            <span class="material-icons text-[28px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-green group-[.active]:scale-110 group-[.active]:-translate-y-1">terrain</span>
            <span class="text-[10px] font-bold text-slate-300 mt-1 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-green nav-label absolute bottom-3">Outdoor</span>
        </button>

        <button class="nav-item group flex-1 h-full flex flex-col items-center justify-center transition-all" onclick="switchView('servizi', this)">
            <span class="material-icons text-[28px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-blue group-[.active]:scale-110 group-[.active]:-translate-y-1">grid_view</span>
            <span class="text-[10px] font-bold text-slate-300 mt-1 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-blue nav-label absolute bottom-3">Servizi</span>
        </button>

    </nav>

    <script src="js/data-logic.js"></script>
    <script src="js/ui-renderers.js"></script>
    <script src="js/legal-render.js"></script>
    <script src="js/ui-modal-contents.js"></script> 
    <script src="js/ui-modal.js"></script> 
    <script src="js/app.js"></script>

    <a href="#" id="ghost-cookie-btn" class="lb-cs-settings-link hidden"></a>
    <script type="text/javascript" src="https://app.legalblink.it/api/scripts/lb_cs.js"></script>
    <script id="lb_cs" type="text/javascript">lb_cs("6973df3d9398e90022bdb48d");</script>
</body> 
</html>
