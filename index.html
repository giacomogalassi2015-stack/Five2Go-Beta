<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Five2Go</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.min.css" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Roboto Slab"', 'serif'],
                    },
                    colors: {
                        // PALETTE "CINQUE TERRE AUTHENTIC"
                        primary: '#264653',          // Blu Notte (Elegante)
                        'ct-terracotta': '#E76F51',  // Rosso Case/Tramonto
                        'ct-terracotta-light': '#FFEDE1', 
                        'ct-yellow': '#E9C46A',      // Giallo Limone/Sole
                        'ct-yellow-light': '#FFFBEB',
                        'ct-blue': '#2A9D8F',        // Verde Acqua/Mare Profondo
                        'ct-blue-light': '#E0F7FA',
                        'ct-green': '#606C38',       // Verde Oliva/Vigne
                        'ct-green-light': '#ECFCCB',
                        'ct-sand': '#F4F1DE',        // Sabbia/Sfondo Caldo
                        
                        surface: '#FFFFFF',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -5px rgba(0,0,0,0.1)', // Ombra morbida
                    },
                    borderRadius: {
                        '3xl': '1.5rem', // Curve più gentili
                    }
                }
            }
        }
    </script>

    <style>
        /* FIX SCROLL & BASE */
        html, body {
            height: 100%; width: 100%; overflow-x: hidden;
            overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent;
            background-color: #F4F1DE; /* ct-sand */
            color: #264653;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animazione Pop-In (Più morbida) */
        @keyframes popIn { 
            0% { opacity: 0; transform: translateY(10px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        .animate-pop { animation: popIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    </style>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.js"></script>
</head>

<body class="text-slate-700 antialiased pb-32">

    <header class="fixed top-0 left-0 right-0 z-50 pointer-events-none"></header>

    <main id="app-content" class="max-w-2xl mx-auto px-4 pt-4 min-h-screen">
        <div id="data-container" class="flex flex-col items-center justify-center h-[80vh]">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 bg-ct-yellow rounded-full animate-ping opacity-30"></div>
                <div class="relative bg-white p-3 rounded-full shadow-soft border-2 border-ct-terracotta">
                    <span class="material-icons text-2xl text-ct-terracotta">explore</span>
                </div>
            </div>
            <p class="font-bold text-primary mt-4 uppercase tracking-widest text-xs opacity-60">Caricamento...</p>
        </div>    
    </main>

    <nav id="bottom-nav" class="fixed bottom-6 left-4 right-4 h-[70px] bg-white/95 backdrop-blur-xl border border-white/50 rounded-[2rem] shadow-xl shadow-stone-500/10 flex justify-around items-center z-50 max-w-md mx-auto">
        
        <button class="nav-item group flex-1 h-full flex flex-col items-center justify-center transition-all" onclick="switchView('home', this)">
            <span class="material-icons text-[26px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-green group-[.active]:-translate-y-1">home</span>
            <span class="text-[9px] font-bold text-slate-300 mt-0.5 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-green nav-label absolute bottom-2 uppercase tracking-wide">Home</span>
        </button>

        <button class="nav-item group flex-1 h-full flex flex-col items-center justify-center transition-all" onclick="switchView('cibo', this)">
            <span class="material-icons text-[24px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-terracotta group-[.active]:-translate-y-1">restaurant</span>
            <span class="text-[9px] font-bold text-slate-300 mt-0.5 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-terracotta nav-label absolute bottom-2 uppercase tracking-wide">Cibo</span>
        </button>

        <button class="nav-item group flex-1 h-full flex flex-col items-center justify-center transition-all" onclick="switchView('outdoor', this)">
            <span class="material-icons text-[24px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-yellow group-[.active]:-translate-y-1">hiking</span>
            <span class="text-[9px] font-bold text-slate-300 mt-0.5 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-yellow nav-label absolute bottom-2 uppercase tracking-wide">Outdoor</span>
        </button>

        <button class="nav-item group flex-1 h-full flex flex-col items-center justify-center transition-all" onclick="switchView('servizi', this)">
            <span class="material-icons text-[24px] text-slate-300 transition-all duration-300 group-[.active]:text-ct-blue group-[.active]:-translate-y-1">grid_view</span>
            <span class="text-[9px] font-bold text-slate-300 mt-0.5 opacity-0 group-[.active]:opacity-100 transition-opacity group-[.active]:text-ct-blue nav-label absolute bottom-2 uppercase tracking-wide">Servizi</span>
        </button>

    </nav>

    <script src="js/data-logic.js"></script>
    <script src="js/ui-renderers.js"></script>
    <script src="js/legal-render.js"></script>
    <script src="js/ui-modal-contents.js"></script> 
    <script src="js/ui-modal.js"></script> 
    <script src="js/app.js"></script>

    <a href="#" id="ghost-cookie-btn" class="lb-cs-settings-link hidden"></a>
    <script type="text/javascript" src="https://app.legalblink.it/api/scripts/lb_cs.js"></script>
    <script id="lb_cs" type="text/javascript">lb_cs("6973df3d9398e90022bdb48d");</script>
</body> 
</html>
