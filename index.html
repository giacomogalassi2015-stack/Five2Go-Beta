<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five2Go</title>

    <!-- PWA Manifest + meta cross-browser -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#264653">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Five2Go">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@raruto/leaflet-elevation/dist/leaflet-elevation.min.css" />

    <!-- Material Icons only – Phosphor and Font Awesome removed -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Roboto Slab"', 'serif'],
                    },
                    colors: {
                        primary: '#264653',
                        'ct-terracotta': '#E76F51',
                        'ct-terracotta-light': '#FFEDE1',
                        'ct-yellow': '#E9C46A',
                        'ct-yellow-light': '#FFFBEB',
                        'ct-blue': '#2A9D8F',
                        'ct-blue-light': '#E0F7FA',
                        'ct-green': '#606C38',
                        'ct-green-light': '#ECFCCB',
                        'ct-sand': '#F4F1DE',
                        surface: '#FFFFFF',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -5px rgba(0,0,0,0.1)',
                        'floating': '0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05)',
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2.5rem',
                    }
                }
            }
        }
    </script>

    <style>
        /* 1. BLOCCO TOTALE DELLA PAGINA */
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            overflow: hidden;
            position: fixed;
            background-color: #F4F1DE;
            color: #264653;
            /* touch-action:manipulation consente pinch-zoom (accessibilità)
               ma previene il double-tap zoom che causa delay e problemi UX.
               Era touch-action:none che bloccava TUTTO → violazione WCAG 2.1 SC 1.4.4 */
            touch-action: manipulation;
            /* Fix scroll rimbalzante su Firefox Android */
            overscroll-behavior: none;
            /* Rimuove il flash grigio al tap su Android Chrome */
            -webkit-tap-highlight-color: transparent;
        }

        /* 2. AREA DI SCROLL INTERNA */
        #app-content {
            height: 100%; width: 100%;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 120px;
            position: relative; z-index: 10;
            scroll-behavior: smooth;
        }

        /* ── HOME: Overlay gradiente FULL-VIEWPORT ──
           Perché su ::after del body e non su .home-v2?
           → L'immagine di sfondo è sul body (position:fixed, cover).
           → .home-v2 sta dentro #app-content che ha pt-4, px-4, max-w-2xl
              → NON copre l'intera viewport (gap in alto, ai lati, in basso).
           → body::after è position:fixed inset:0 → copre TUTTO, pixel per pixel.
           → z-index:1 lo mette sopra il bg ma sotto #app-content (z-index:10).
           
           Il gradiente è cinematografico: velo leggero in alto per far respirare
           la foto, si intensifica verso il basso per garantire leggibilità
           di titolo, tagline, search bar e pill buttons. */
        body.is-home::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.15) 0%,
                rgba(0,0,0,0.18) 10%,
                rgba(0,0,0,0.25) 25%,
                rgba(0,0,0,0.38) 42%,
                rgba(0,0,0,0.55) 58%,
                rgba(0,0,0,0.70) 74%,
                rgba(0,0,0,0.80) 88%,
                rgba(0,0,0,0.88) 100%
            );
        }
        /* Sulla home: rimuovi padding-top per layout immersivo edge-to-edge.
           Il pt-4 serve alle view con contenuti (cibo, outdoor, servizi)
           ma la landing page deve usare tutta la viewport. */
        body.is-home #app-content {
            padding-top: 0;
        }

        /* Nascondi scrollbar */
        .no-scrollbar::-webkit-scrollbar,
        #app-content::-webkit-scrollbar { display: none; }
        .no-scrollbar, #app-content { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes popIn {
            0%   { opacity: 0; transform: translateY(10px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* BUMP CENTRALE */
        .nav-center-bump {
            position: absolute; top: -24px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            z-index: 60;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
        }
        .nav-center-bump.hidden-bump {
            transform: translateX(-50%) translateY(80px);
            opacity: 0; pointer-events: none;
        }
        .nav-center-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex; align-items: center; justify-content: center;
            border: 2.5px solid rgba(255,255,255,0.6);
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-center-btn:active {
            transform: scale(0.88);
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        /* ── BADGE TRANSLATE sull'icona lingua ── */
        .lang-btn-inner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .lang-translate-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #264653;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.18);
            pointer-events: none;
        }
        .lang-translate-badge .material-icons {
            font-size: 11px;
            color: #fff;
            line-height: 1;
        }

        /* ── PULSE prima visita ── */
        @keyframes langPulseRing {
            0%   { transform: scale(1);   opacity: 0.5; }
            70%  { transform: scale(1.6); opacity: 0; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .lang-pulse-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2.5px solid #264653;
            animation: langPulseRing 1.8s cubic-bezier(0.4,0,0.2,1) infinite;
            pointer-events: none;
        }

        /* ── TOOLTIP prima visita ── */
        .lang-first-tooltip {
            position: fixed;
            bottom: 106px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9010;
            background: #264653;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.01em;
            padding: 10px 18px;
            border-radius: 14px;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(38,70,83,0.35);
            animation: tooltipFadeIn 0.35s cubic-bezier(0.2,0.8,0.2,1) forwards;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .lang-first-tooltip::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background: #264653;
            border-radius: 0 0 3px 0;
            transform: translateX(-50%) rotate(45deg);
        }
        .lang-first-tooltip .material-icons {
            font-size: 16px;
            opacity: 0.85;
        }
        @keyframes tooltipFadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.92); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }
        @keyframes tooltipFadeOut {
            from { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            to   { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.92); }
        }

        #bump-lang-panel {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9002;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 -4px 32px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.04);
            overflow: hidden;
            min-width: 200px;
            animation: bumpPanelIn 0.28s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes bumpPanelIn {
            from { opacity:0; transform:translateX(-50%) translateY(12px) scale(0.94); }
            to   { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
        }

        /* Search results sheet scrollbar */
        #search-results-sheet {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #search-results-sheet::-webkit-scrollbar { display: none; }

        /* Keyword highlight */
        mark { background: rgba(252,211,77,0.45); border-radius: 3px; padding: 0 2px; color: inherit; font-style: inherit; }

        /* Loading bar animation */
        @keyframes loadingBar {
            0%   { transform: translateX(-100%); width: 40%; }
            50%  { transform: translateX(150%);  width: 60%; }
            100% { transform: translateX(300%);  width: 40%; }
        }


        /* Splash → Home fade transition */
        #splash-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: #F4F1DE;
            pointer-events: none;
            transition: opacity 0.55s cubic-bezier(0.4,0,0.2,1);
        }
        #splash-overlay.fade-out { opacity: 0; }
        #splash-overlay.gone { display: none; }
        /* Nav labels: minimum 11px */
        .nav-label { font-size: 11px; }

        /* ── ANIMAZIONI MANCANTI ── */

        /* .spin: usata da loader e icone di caricamento in tutti i file JS */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .spin { animation: spin 1s linear infinite; display: inline-block; }

        /* animate-fade: usata per l'apparizione di contenuti dinamici */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.35s ease-out forwards; }

        /* ── CROSS-BROWSER FIXES ── */

        /* Fix 1: Nasconde il pulsante X nativo dell'input search su Chrome/Safari/Edge */
        input[type="search"]::-webkit-search-decoration,
        input[type="search"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-results-button,
        input[type="search"]::-webkit-search-results-decoration { display: none; }
        /* Firefox */
        input[type="search"] { -moz-appearance: none; appearance: none; }

        /* Fix 2: Fallback opaco per browser senza backdrop-filter (Firefox < 103, alcuni Android) */
        @supports not (backdrop-filter: blur(1px)) {
            #bottom-nav { background: rgba(255,255,255,0.98) !important; }
            .nav-sticky-header { background: #F4F1DE !important; }
            #search-results-sheet { background: #ffffff !important; }
            .smart-filter-bar-container button { background: rgba(255,255,255,0.98) !important; }
        }

        /* ── Sticky tab bar: rimosso sticky, ora è contenuto statico ──
           I FAB flottanti sostituiscono lo sticky: zero bug visivi,
           più spazio verticale, UX thumb-friendly */
        .nav-sticky-header {
            background: #F4F1DE;
        }

        /* ── Filter bar: anche questa ora è statica ── */
        .smart-filter-bar-container {
            background: #F4F1DE;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        /* ── FAB flottanti (filtro + scroll-to-top) ──
           Appaiono quando l'utente scrolla oltre il tab bar.
           Posizionati a destra, sopra la bottom nav.
           Pattern usato da Google Maps, Zalando, Deliveroo. */
        .fab-scroll-actions {
            position: fixed;
            right: 16px;
            bottom: 90px;
            z-index: 45;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: none;
            /* Transizione globale per tutto il gruppo */
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .fab-scroll-actions.fab-hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            pointer-events: none;
        }
        .fab-scroll-actions.fab-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .fab-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18), 0 1px 4px rgba(0,0,0,0.08);
            transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .fab-btn:active {
            transform: scale(0.88);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .fab-btn--top {
            background: white;
            color: #264653;
        }
        .fab-btn--filter {
            background: #264653;
            color: white;
        }

        /* ══════════════════════════════════════════════════════════
           HOME V2 — Landing Page
           Layout moderno: flex-col fullscreen con gradiente immersivo.
             body (position:fixed) → immagine di sfondo
             #app-content → trasparente, scroll interno
             .home-v2 → flex-col, occupa l'intera altezza viewport
               ├── .home-hero-central → titolo centrato (flex-1)
               └── .home-actions   → 3 pill glass in basso
           ══════════════════════════════════════════════════════════ */

        .home-v2 {
            display: flex;
            flex-direction: column;
            /* Fallback per browser senza dvh */
            min-height: calc(100vh - 160px);
            /* dvh = dynamic viewport height, esclude la barra browser su mobile */
            min-height: calc(100dvh - 100px);
            padding: 0;
            /* Gradiente rimosso da qui — ora gestito da body.is-home::after
               che copre l'intera viewport senza gap (vedi sopra).
               .home-v2 resta trasparente: solo layout flex-col. */
        }

        /* ── Hero central: contenuto centrato verticalmente ── */
        .home-hero-central {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0 28px 32px;
            gap: 0;
            /* Gradiente rimosso — gestito dal padre .home-v2 */
        }

        /* Label "CINQUE TERRE" sopra il titolo */
        .home-location-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #E9C46A;
            margin-bottom: 12px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }
        .home-location-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #E9C46A;
            box-shadow: 0 0 8px rgba(233,196,106,0.6);
            flex-shrink: 0;
        }

        /* Titolo principale: "Five" + "2Go" sulla stessa riga */
        .home-title {
            font-family: "Playfair Display", "Roboto Slab", serif;
            font-size: clamp(3.6rem, 15vw, 5rem);
            font-weight: 900;
            line-height: 0.92;
            letter-spacing: -0.03em;
            margin: 0 0 14px 0;
        }
        /* "Five" — corsivo dorato */
        .home-title-five {
            font-style: italic;
            color: #E9C46A;
            text-shadow: 0 2px 20px rgba(233,196,106,0.35), 0 4px 30px rgba(0,0,0,0.45);
        }
        /* "2Go" — bianco solido */
        .home-title-2go {
            font-style: normal;
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0,0,0,0.45);
        }

        /* Sottotitolo / tagline */
        .home-tagline {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.80);
            line-height: 1.6;
            max-width: 300px;
            letter-spacing: 0.01em;
        }

        /* ── Search bar glass ── */
        .home-search-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 20px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 16px;
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            padding: 0 14px;
            height: 48px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.10);
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .home-search-wrap:focus-within {
            background: rgba(255,255,255,0.20);
            border-color: rgba(255,255,255,0.35);
            box-shadow: 0 4px 24px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .home-search-icon {
            font-size: 20px;
            color: rgba(255,255,255,0.60);
            flex-shrink: 0;
            margin-right: 10px;
            pointer-events: none;
        }
        .home-search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: "Plus Jakarta Sans", sans-serif;
            /* 16px è il minimo per evitare l'auto-zoom di iOS Safari al focus.
               Con 13px iOS ingrandiva la viewport, rompendo il layout. */
            font-size: 16px;
            font-weight: 500;
            color: rgba(255,255,255,0.92);
            letter-spacing: 0.01em;
            min-width: 0;
        }
        .home-search-input::placeholder {
            color: rgba(255,255,255,0.50);
            font-weight: 500;
        }
        .home-search-clear {
            flex-shrink: 0;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.70);
            cursor: pointer;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .home-search-clear:active {
            background: rgba(255,255,255,0.30);
        }

        /* ── Actions: 3 pill glass in basso ── */
        .home-actions {
            padding: 0 16px 28px;
            display: flex;
            gap: 10px;
            /* Gradiente rimosso — gestito dal padre .home-v2 */
        }

        .home-pill {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 10px;
            border-radius: 50px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.22);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            cursor: pointer;
            transition: background 0.20s ease, transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.20s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.15);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .home-pill:active {
            transform: scale(0.93);
            background: rgba(255,255,255,0.22);
            box-shadow: 0 2px 8px rgba(0,0,0,0.20);
        }
        .home-pill--heart .home-pill-icon { color: #fb7185 !important; }
        .home-pill--itin  .home-pill-icon { color: #fbbf24 !important; }
        .home-pill--map   .home-pill-icon { color: #5eead4 !important; }
        .home-pill-icon {
            font-size: 18px !important;
            color: rgba(255,255,255,0.90);
            flex-shrink: 0;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.30));
        }
        .home-pill-label {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.88);
            white-space: nowrap;
        }
        .home-pill-badge {
            position: absolute;
            top: -5px; right: -2px;
            background: #E76F51;
            color: #fff;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 9px;
            font-weight: 900;
            min-width: 18px;
            height: 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(231,111,81,0.60);
            border: 1.5px solid rgba(255,255,255,0.30);
        }

        /* ── Alias retrocompatibilità ── */
        .home-quick-row     { display: none !important; }
        .home-section-label { display: none !important; }
        .home-grid          { display: none !important; }
        [data-home-badge]   { }

        /* ══════════════════════════════════════════════════════════
           CHICCO — Mascotte "seduta sulla barra"
           Grappolo d'uva animato (Lottie) posizionato in basso a sinistra,
           appoggiato sopra la nav bar. Al tap si espande una card meteo.
           Stato idle: immagine statica da Cloudinary.
           Stato attivo: animazione Lottie che "parla" mentre mostra il meteo.
           ══════════════════════════════════════════════════════════ */
        .chicco-fab {
            position: fixed;
            left: 14px;
            bottom: 76px;
            z-index: 48;
            pointer-events: auto;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
        }
        .chicco-fab.chicco-hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.7);
            pointer-events: none;
        }
        .chicco-fab-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: relative;
            padding: 0;
            /* Chicco deborda leggermente dal cerchio per dare l'effetto
               "appoggiato" sulla barra — non ingabbiato */
            overflow: visible;
        }
        .chicco-fab-btn:active {
            transform: scale(0.85);
        }
        /* Stato "parla": Chicco si ingrandisce del 30% quando la card è aperta,
           simulando un avvicinamento come in una conversazione reale.
           La transizione è spring-like per dare un effetto organico. */
        .chicco-fab.chicco-talking .chicco-fab-btn {
            transform: scale(1.3);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        /* Immagine statica di Chicco — idle state */
        .chicco-fab-img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
            pointer-events: none;
        }
        /* Container Lottie — sovrapposto all'immagine quando anima */
        .chicco-fab-lottie {
            position: absolute;
            inset: -4px;
            width: 64px;
            height: 64px;
            pointer-events: none;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
        }

        /* Card meteo espansa */
        .chicco-card {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 88px;
            z-index: 9003;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border-radius: 20px;
            box-shadow: 0 -4px 32px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.04);
            padding: 20px;
            max-width: 380px;
            animation: chiccoCardIn 0.3s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes chiccoCardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* Header card con Chicco Lottie animato */
        .chicco-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .chicco-card-anim {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
        }
        .chicco-card-weather {
            font-size: 14px;
            color: #475569;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .chicco-card-advice {
            font-size: 13px;
            font-weight: 600;
            color: #264653;
            line-height: 1.5;
            padding: 12px 14px;
            background: #F4F1DE;
            border-radius: 12px;
            border-left: 3px solid #E9C46A;
        }
        .chicco-card-close {
            position: absolute;
            top: 12px; right: 12px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.06);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #94a3b8;
            -webkit-tap-highlight-color: transparent;
        }
        .chicco-card-close:active {
            background: rgba(0,0,0,0.12);
        }

        /* ── Near Me button nella filter bar ── */
        .near-me-btn {
            flex-shrink: 0;
            width: 42px; height: 42px;
            border-radius: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            color: #94a3b8;
            -webkit-tap-highlight-color: transparent;
        }
        .near-me-btn.active-near-me {
            background: #2A9D8F;
            border-color: #2A9D8F;
            color: white;
        }

        /* ── Offline badge persistente ── */
        .offline-badge {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9000;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #264653;
            color: rgba(255,255,255,0.92);
            padding: 7px 16px;
            border-radius: 50px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            pointer-events: none;
            transition: opacity 0.4s ease;
            animation: offlineBadgeIn 0.35s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes offlineBadgeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ══════════════════════════════════════════════════════════
           MOBILE-FIRST CARD SIZING
           Altezze immagine responsive in base al contesto:
           - Full-width (ristoranti, spiagge, attrazioni): 200px
           - Grid 2-col (prodotti): 140px — proporzionato alla larghezza
           - line-clamp per titoli lunghi (es. cinese/tedesco)
           ══════════════════════════════════════════════════════════ */

        /* Default: altezza immagine per card a larghezza piena */
        .master-card-img {
            height: 200px;
        }

        /* Dentro griglia 2-col: immagine più bassa, proporzionata */
        .grid-cols-2 .master-card-img {
            height: 140px;
        }

        /* Dentro griglia 2-col: rimuovi margin-bottom (il gap del grid basta) */
        .grid-cols-2 .master-card {
            margin-bottom: 0;
        }

        /* Card a larghezza piena (fuori dal grid): mantieni spacing */
        .master-card {
            margin-bottom: 16px;
        }

        /* Su schermi >= 640px: immagini un pelo più generose */
        @media (min-width: 640px) {
            .master-card-img { height: 224px; }
            .grid-cols-2 .master-card-img { height: 170px; }
        }

        /* Fallback per browser senza line-clamp nativo (raro, ma safety net) */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

    </style>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>

<script>
// ── Registrazione Service Worker ──────────────────────────────────────────
// Il SW è necessario per due cose:
//   1. Offline support: intercetta le richieste di rete e serve asset/dati
//      dalla CacheStorage quando non c'è connessione.
//   2. Installabilità PWA: Chrome/Safari richiedono un SW attivo per mostrare
//      il banner "Aggiungi alla schermata home".
// La registrazione avviene su 'load' (non DOMContentLoaded) per non ritardare
// il rendering iniziale dell'app.
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .catch(err => console.warn('[SW] Registrazione fallita:', err));
    });
}
</script>
